; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -DPLATFORMIO_BUILD
test_ignore = *
lib_deps =
    robtillaart/AS5600@^0.6.1
    luni64/TeensyTimerTool@^1.4.1

; [env:micro]
; platform = atmelavr
; board = micro
; framework = arduino

[env:teensy40_wing_deploy]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
build_flags = -DPLATFORMIO_BUILD
build_src_filter =
    +<hal/hal_button.cpp>
    +<hal/hal_pin_extender.cpp>
    +<main_wing_deploy.cpp>

[env:teensy40_pin_extender]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
build_flags = -DPLATFORMIO_BUILD
build_src_filter =
    +<hal/hal_button.cpp>
    +<hal/hal_pin_extender.cpp>
    +<main_pin_extender.cpp>

[env:teensy40_distance]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
build_flags = -DPLATFORMIO_BUILD
build_src_filter =
    +<main_distance.cpp>
lib_deps =
    sparkfun/SparkFun XM125 Arduino Library

[env:teensy41_ldr_compare]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -DPLATFORMIO_BUILD
build_src_filter =
    +<main_ldr_compare.cpp>

[env:teensy41_ldr_track]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -DPLATFORMIO_BUILD
lib_deps =
    robtillaart/AS5600@^0.6.1
build_src_filter =
    +<hal/hal_greenjay_esc.cpp>
    +<hal/hal_as5600.cpp>
    +<main_ldr_track.cpp>

