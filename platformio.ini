[env:esp32s2_distance]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
; This board talks to the PC via a CP2102 USB-UART bridge (VID 10C4) wired to
; UART0 -- NOT the S2 native USB. So Serial must stay on UART0: CDC_ON_BOOT=0.
; (The lolin_s2_mini board default enables CDC-on-boot/native USB, which would
; route Serial to the unconnected D+/D- pins and produce no output here.)
build_flags =
    -DPLATFORMIO_BUILD
    -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter =
    +<main_distance.cpp>
lib_deps =
    sparkfun/Sparkfun XM125 Arduino Library